name = "odishaaspirants"
pages_build_output_dir = "./dist"
compatibility_date = "2025-09-01"
compatibility_flags = [
  "nodejs_compat",
  "enable_nodejs_http_modules",
  "enable_nodejs_http_server_modules",
  "allow_eval_during_startup"
]

[vars]
NODE_ENV = "production"
ADMIN_USERNAME = "admin"
ADMIN_SUBDOMAIN = "setup.odishaaspirants.com"
PUBLIC_SITE_URL = "https://odishaaspirants.com"

[[d1_databases]]
binding = "DB"
database_name = "odishaaspirants_db"
database_id = "08121a59-c6c5-4f9c-9fed-c376f17bd23d"

[[r2_buckets]]
binding = "STORAGE_BUCKET"
bucket_name = "odishaaspirants"
